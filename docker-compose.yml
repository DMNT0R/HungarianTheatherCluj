# Ioi!Cluj auf dem NAS ausliefern.
#
#   docker compose up -d
#
# Danach ist die App im Heimnetz unter http://<NAS-IP>:8088 erreichbar.
# Im Cloudflare-Tunnel eine Public Hostname anlegen, die auf diesen
# Dienst zeigt (siehe README, Abschnitt „Self-hosting“).

services:
  ioi-cluj:
    image: nginx:1.27-alpine
    container_name: ioi-cluj
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
