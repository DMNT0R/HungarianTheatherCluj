# nginx-Konfiguration für (T) Our.Cluj (statische Web-App)
# Wird von docker-compose.yml in den Container eingebunden.
# HTTPS übernimmt der Cloudflare-Tunnel; nginx spricht intern nur HTTP.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    # Interne Dateien nicht ausliefern (.git, .gitkeep, deploy/, docker-compose.yml)
    location ~ /\. { deny all; return 404; }
    location ^~ /deploy/ { deny all; return 404; }
    location ^~ /tools/ { deny all; return 404; }
    location ^~ /docs/ { deny all; return 404; }
    location = /docker-compose.yml { deny all; return 404; }

    # App-Code immer frisch prüfen lassen, damit Updates sofort ankommen
    # (gilt auch für den Cloudflare-Cache, der diese Header respektiert)
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location ~* \.webmanifest$ {
        # Nur hier den Typ setzen – ein types-Block auf Server-Ebene
        # würde die Standard-MIME-Liste von nginx komplett ersetzen.
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    # Bilder, Audio, Leaflet-Grafiken: dürfen eine Woche gecacht werden
    location ~* \.(png|jpg|jpeg|svg|mp3|m4a|ogg)$ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
