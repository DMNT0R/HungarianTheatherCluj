# Sicherheits-Header (gleiche Werte wie _headers für Cloudflare).
# Wird in jedem location-Block eingebunden, weil nginx add_header aus dem
# server-Block nicht erbt, sobald ein location-Block eigene Header setzt.
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://www.huntheater.ro; media-src 'self' blob:; connect-src 'self' https://*.tile.openstreetmap.org https://www.huntheater.ro https://cloudflareinsights.com; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), bluetooth=(), serial=(), hid=(), midi=(), interest-cohort=()" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
