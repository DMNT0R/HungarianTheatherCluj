<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6e1a26">
  <title>Ioi!Cluj</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Startbildschirm -->
  <section id="intro" class="intro">
    <div class="intro-inner">
      <div class="curtain-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M6 8h52v6H6z" fill="currentColor"/><path d="M8 14c0 18 6 34 18 42H8z M56 14c0 18-6 34-18 42h18z" fill="currentColor" opacity=".85"/></svg>
      </div>
      <p class="eyebrow" id="intro-organizer"></p>
      <h1 id="intro-title"></h1>
      <p class="lead" id="intro-subtitle"></p>
      <div class="lang-switch intro-lang" role="group" aria-label="Language · Nyelv · Limba"></div>
      <ul class="facts">
        <li><strong id="intro-count">7</strong> <span data-i18n="stations"></span></li>
        <li><strong data-i18n="walkDist"></strong> <span data-i18n="onFoot"></span></li>
        <li><strong data-i18n="duration"></strong></li>
      </ul>
      <button class="btn btn-primary btn-lg" id="start-btn" data-i18n="start"></button>
      <p class="hint" data-i18n="hint"></p>
      <p class="proto-note" data-i18n="protoNote"></p>
    </div>
  </section>

  <!-- Kopfzeile -->
  <header class="topbar">
    <button class="icon-btn" id="list-btn" data-i18n-aria="aMenu">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="topbar-title">
      <span id="tour-title"></span>
      <span class="progress-label" id="progress-label"></span>
    </div>
    <button class="lang-btn" id="lang-btn" aria-label="Language · Nyelv · Limba">EN</button>
    <button class="icon-btn" id="locate-btn" data-i18n-aria="aLocate">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div class="progress-bar"><div id="progress-fill"></div></div>

  <!-- Karte -->
  <main id="map" data-i18n-aria="aMap"></main>

  <div class="demo-banner" id="demo-banner" data-i18n="demoBanner" hidden></div>

  <!-- Karte der nächsten Station (unten) -->
  <section class="next-card" id="next-card">
    <div class="next-num" id="next-num">1</div>
    <div class="next-info">
      <div class="next-label" id="next-label"></div>
      <div class="next-title" id="next-title"></div>
      <div class="next-meta" id="next-meta"></div>
    </div>
    <button class="btn btn-primary" id="next-open"></button>
  </section>

  <!-- Stationsliste -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2 data-i18n="stationsTitle"></h2>
      <button class="icon-btn" id="drawer-close" data-i18n-aria="aClose">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <ol class="station-list" id="station-list"></ol>
    <div class="drawer-foot">
      <div class="lang-switch" role="group" aria-label="Language · Nyelv · Limba"></div>
      <label class="switch">
        <input type="checkbox" id="demo-toggle">
        <span data-i18n="demoMode"></span>
      </label>
      <button class="btn btn-ghost" id="reset-btn" data-i18n="resetProgress"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- Stationsdetail mit Audio -->
  <section class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-labelledby="sheet-title">
    <div class="sheet-grip"></div>
    <button class="icon-btn sheet-close" id="sheet-close" data-i18n-aria="aClose">
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <div class="sheet-hero" id="sheet-hero">
      <span class="sheet-year" id="sheet-year"></span>
      <span class="sheet-num" id="sheet-num"></span>
    </div>
    <div class="sheet-body">
      <p class="eyebrow" id="sheet-subtitle"></p>
      <h2 id="sheet-title"></h2>
      <p class="sheet-address" id="sheet-address"></p>

      <div class="gallery-wrap" id="sheet-media-wrap" hidden>
        <div class="gallery" id="sheet-media"></div>
        <p class="media-credit" id="media-credit"></p>
      </div>

      <div class="player" id="player">
        <button class="play-btn" id="play-btn" data-i18n-aria="aPlay">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
        </button>
        <div class="player-main">
          <div class="player-track" id="player-track"><div class="player-fill" id="player-fill"></div></div>
          <div class="player-meta">
            <span id="player-time">0:00</span>
            <span id="player-source"></span>
          </div>
        </div>
        <div class="player-side">
          <button class="chip" id="back-btn" data-i18n-aria="aBack">−15</button>
          <button class="chip" id="rate-btn" data-i18n-aria="aRate">1×</button>
        </div>
      </div>

      <button class="rephoto-btn" id="rephoto-btn" type="button" hidden>
        <span class="rephoto-icon" aria-hidden="true">◐</span>
        <span><strong data-i18n="rpButton"></strong><small data-i18n="rpSub"></small></span>
      </button>

      <div class="story" id="sheet-text"></div>

      <div class="activity" id="sheet-activity" hidden>
        <div class="activity-head"><span class="activity-icon" id="act-icon"></span><h3 id="act-title"></h3></div>
        <p id="act-text"></p>
        <ul class="activity-items" id="act-items"></ul>
        <div class="photo-box" id="act-photo" hidden>
          <input type="file" accept="image/*" capture="user" id="photo-input" hidden>
          <img id="photo-preview" alt="" hidden>
          <div class="photo-actions">
            <button class="btn btn-primary" id="photo-btn"></button>
            <button class="btn btn-ghost" id="photo-share" data-i18n="share" hidden></button>
          </div>
          <p class="photo-note" data-i18n="photoNote"></p>
        </div>
      </div>
      <div class="links" id="sheet-links"></div>

      <div class="sheet-actions">
        <button class="btn btn-ghost" id="route-btn" data-i18n="route"></button>
        <button class="btn btn-primary" id="sheet-next"></button>
      </div>
    </div>
  </section>

  <!-- Vollbildansicht für Archivbilder -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true">
    <button class="icon-btn lightbox-close" id="lightbox-close" data-i18n-aria="aClose">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn lightbox-nav prev" id="lightbox-prev" data-i18n-aria="aPrev">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <figure>
      <img id="lightbox-img" alt="">
      <figcaption id="lightbox-cap"></figcaption>
    </figure>
    <button class="icon-btn lightbox-nav next" id="lightbox-next" data-i18n-aria="aNext">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>

  <!-- Damals & Heute: historisches Bild über der Live-Kamera -->
  <section class="rp" id="rp" hidden role="dialog" aria-modal="true" aria-labelledby="rp-caption">
    <video id="rp-video" playsinline muted autoplay></video>
    <img id="rp-still" alt="" hidden>
    <div class="rp-layer" id="rp-layer"><img id="rp-img" alt="" draggable="false"></div>
    <div class="rp-divider" id="rp-divider" hidden></div>
    <div class="rp-gestures" id="rp-gestures"></div>
    <div class="rp-top">
      <button class="icon-btn rp-close" id="rp-close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="rp-title"><strong id="rp-caption"></strong><span id="rp-year"></span></div>
    </div>
    <p class="rp-hint" id="rp-hint"></p>
    <div class="rp-msg" id="rp-msg" hidden>
      <p id="rp-msg-text"></p>
      <button class="btn btn-primary" id="rp-photo-btn" type="button"></button>
      <input type="file" accept="image/*" capture="environment" id="rp-file" hidden>
    </div>
    <div class="rp-bottom">
      <div class="rp-thumbs" id="rp-thumbs"></div>
      <input type="range" id="rp-slider" min="0" max="100" value="55">
      <div class="rp-controls">
        <div class="rp-seg"><button type="button" id="rp-mode-blend"></button><button type="button" id="rp-mode-swipe"></button></div>
        <button class="rp-shutter" id="rp-shutter" type="button"></button>
        <button class="chip rp-reset" id="rp-reset" type="button"></button>
      </div>
      <p class="rp-credit" id="rp-credit"></p>
    </div>
    <div class="rp-result" id="rp-result" hidden>
      <img id="rp-result-img" alt="">
      <div class="rp-result-actions">
        <button class="btn btn-ghost" id="rp-back" type="button"></button>
        <button class="btn btn-primary" id="rp-share" type="button"></button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/stations.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/rephoto.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
