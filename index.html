<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6e1a26">
  <title>Bühne Kolozsvár – Theatertour Cluj</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Startbildschirm -->
  <section id="intro" class="intro">
    <div class="intro-inner">
      <div class="curtain-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M6 8h52v6H6z" fill="currentColor"/><path d="M8 14c0 18 6 34 18 42H8z M56 14c0 18-6 34-18 42h18z" fill="currentColor" opacity=".85"/></svg>
      </div>
      <p class="eyebrow" id="intro-organizer"></p>
      <h1 id="intro-title"></h1>
      <p class="lead" id="intro-subtitle"></p>
      <ul class="facts">
        <li><strong id="intro-count">6</strong> Stationen</li>
        <li><strong>ca. 4 km</strong> zu Fuß</li>
        <li><strong>ca. 90 min</strong></li>
      </ul>
      <button class="btn btn-primary btn-lg" id="start-btn">Tour starten</button>
      <p class="hint">Kopfhörer empfohlen. Die App nutzt Ihren Standort, um Sie zu den Stationen zu führen.</p>
      <p class="proto-note">Prototyp · Inhalte vorläufig</p>
    </div>
  </section>

  <!-- Kopfzeile -->
  <header class="topbar">
    <button class="icon-btn" id="list-btn" aria-label="Stationsliste">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="topbar-title">
      <span id="tour-title"></span>
      <span class="progress-label" id="progress-label"></span>
    </div>
    <button class="icon-btn" id="locate-btn" aria-label="Auf meinen Standort zentrieren">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div class="progress-bar"><div id="progress-fill"></div></div>

  <!-- Karte -->
  <main id="map" aria-label="Karte der Tour"></main>

  <div class="demo-banner" id="demo-banner" hidden>
    Demo-Modus: Tippen Sie auf die Karte, um Ihren Standort zu setzen.
  </div>

  <!-- Karte der nächsten Station (unten) -->
  <section class="next-card" id="next-card">
    <div class="next-num" id="next-num">1</div>
    <div class="next-info">
      <div class="next-label" id="next-label">Nächste Station</div>
      <div class="next-title" id="next-title"></div>
      <div class="next-meta" id="next-meta"></div>
    </div>
    <button class="btn btn-primary" id="next-open">Öffnen</button>
  </section>

  <!-- Stationsliste -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>Stationen</h2>
      <button class="icon-btn" id="drawer-close" aria-label="Schließen">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <ol class="station-list" id="station-list"></ol>
    <div class="drawer-foot">
      <label class="switch">
        <input type="checkbox" id="demo-toggle">
        <span>Demo-Modus (Standort simulieren)</span>
      </label>
      <button class="btn btn-ghost" id="reset-btn">Fortschritt zurücksetzen</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- Stationsdetail mit Audio -->
  <section class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-labelledby="sheet-title">
    <div class="sheet-grip"></div>
    <button class="icon-btn sheet-close" id="sheet-close" aria-label="Schließen">
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <div class="sheet-hero" id="sheet-hero">
      <span class="sheet-year" id="sheet-year"></span>
      <span class="sheet-num" id="sheet-num"></span>
    </div>
    <div class="sheet-body">
      <p class="eyebrow" id="sheet-subtitle"></p>
      <h2 id="sheet-title"></h2>
      <p class="sheet-address" id="sheet-address"></p>

      <div class="player" id="player">
        <button class="play-btn" id="play-btn" aria-label="Abspielen">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
        </button>
        <div class="player-main">
          <div class="player-track" id="player-track"><div class="player-fill" id="player-fill"></div></div>
          <div class="player-meta">
            <span id="player-time">0:00</span>
            <span id="player-source"></span>
          </div>
        </div>
        <div class="player-side">
          <button class="chip" id="back-btn" aria-label="15 Sekunden zurück">−15</button>
          <button class="chip" id="rate-btn" aria-label="Geschwindigkeit">1×</button>
        </div>
      </div>

      <div class="story" id="sheet-text"></div>

      <div class="sheet-actions">
        <button class="btn btn-ghost" id="route-btn">Route in Karten-App</button>
        <button class="btn btn-primary" id="sheet-next">Zur nächsten Station</button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/stations.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
